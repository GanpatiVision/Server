<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ganpati AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    #info {
      position:fixed; z-index:10; top:12px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.72); color:#fff; padding:10px 14px; border-radius:12px;
      text-align:center; max-width:88%; font-size:14px;
    }
    #start {
      position:fixed; z-index:20; left:50%; top:50%; transform:translate(-50%,-50%);
      padding:14px 22px; border:0; border-radius:12px; font-size:17px; font-weight:bold;
    }
    #hint { display:none; }
  </style>
</head>
<body>
  <div id="info">
    <b>Ganpati AR</b><br>
    <span id="status">Tap Start AR, then point the camera at the printed pattern.</span>
  </div>

  <button id="start">Start AR</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Put your Ganpati GLB in this folder and name it ganpati.glb -->
      <a-asset-item id="ganpatiModel" src="./ganpati.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#ganpatiModel"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="0.25 0.25 0.25">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#target");
    const start = document.querySelector("#start");
    const status = document.querySelector("#status");

    start.addEventListener("click", async () => {
      start.style.display = "none";
      status.textContent = "Starting camera…";
      await scene.systems["mindar-image-system"].start();
      status.textContent = "Point the camera at the 18 × 18 cm Ganpati pattern.";
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "Ganpati found!";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "Point the camera at the printed pattern.";
    });

    scene.addEventListener("arError", () => {
      start.style.display = "block";
      status.textContent = "Camera could not start. Check camera permission.";
    });
  </script>
</body>
</html>
