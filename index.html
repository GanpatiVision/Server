<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ganpati AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .ar-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    /* MindAR puts the live camera behind the A-Frame canvas.
       Do not put a black scanning overlay above it. */
    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    /* Disable MindAR's default black scanning/loading UI. */
    .mindar-ui-overlay {
      display: none !important;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(0,0,0,.60);
      color: white;
      text-align: center;
      font-size: 14px;
      max-width: 88%;
      pointer-events: none;
    }

    #error {
      display: none;
      position: fixed;
      z-index: 20;
      top: 25%;
      left: 6%;
      right: 6%;
      padding: 18px;
      border-radius: 14px;
      background: rgba(150,0,0,.90);
      color: white;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div class="ar-container">
    <div id="status">Starting camera…</div>
    <div id="error"></div>

    <a-scene
      embedded
      color-space="sRGB"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        maxTrack: 1;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      ">

      <a-assets timeout="30000">
        <a-asset-item id="ganpatiModel" src="./ganpati.glb"></a-asset-item>
      </a-assets>

      <a-camera
        active="true"
        position="0 0 0"
        look-controls="enabled: false"
        wasd-controls="enabled: false">
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-light type="ambient" intensity="2"></a-light>
        <a-light type="directional" intensity="2" position="1 2 1"></a-light>

        <a-gltf-model
          src="#ganpatiModel"
          position="0 0 0.15"
          rotation="0 0 0"
          scale="0.5 0.5 0.5">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <script>
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const target = document.querySelector("[mindar-image-target]");

    scene.addEventListener("arReady", () => {
      status.textContent = "Camera ready — point at your printed pattern.";
    });

    scene.addEventListener("arError", () => {
      status.style.display = "none";
      error.style.display = "block";
      error.textContent =
        "AR could not start. Allow camera access in Chrome and reload the page.";
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "Pattern found — Ganpati appearing!";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "Point the camera at your printed pattern.";
    });

    document.querySelector("#ganpatiModel").addEventListener("error", () => {
      status.style.display = "none";
      error.style.display = "block";
      error.textContent =
        "Ganpati model could not load. Check that ganpati.glb is in the repository.";
    });
  </script>
</body>
</html>
