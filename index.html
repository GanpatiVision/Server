<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ganpati AR</title>

  <!-- Official MindAR + A-Frame setup -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,.72);
      padding: 10px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      max-width: 88%;
    }

    #error {
      display: none;
      position: fixed;
      z-index: 30;
      left: 5%;
      right: 5%;
      top: 25%;
      color: white;
      background: rgba(160,0,0,.9);
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      line-height: 1.45;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="status">Starting AR… Please allow camera access.</div>
  <div id="error"></div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="ganpatiModel" src="./ganpati.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

    <!-- One target: targetIndex 0 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Lighting for the GLB -->
      <a-light type="ambient" intensity="2"></a-light>
      <a-light type="directional" intensity="2" position="1 2 1"></a-light>

      <!-- Ganpati model -->
      <a-gltf-model
        src="#ganpatiModel"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("[mindar-image-target]");

    function showError(message) {
      status.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    scene.addEventListener("arReady", () => {
      status.textContent = "Camera ready. Point at your printed tracking pattern.";
    });

    scene.addEventListener("arError", (event) => {
      console.error("MindAR error:", event);
      showError(
        "AR could not start. Make sure Chrome has camera permission, " +
        "then reload this page. If it still fails, send a screenshot of this message."
      );
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "Pattern found! Ganpati loading…";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "Point the camera at the tracking pattern.";
    });

    // Catch model loading errors.
    document.querySelector("#ganpatiModel").addEventListener("error", (e) => {
      console.error("GLB loading error:", e);
      showError("The Ganpati model could not be loaded. Check that ganpati.glb is in the repository root.");
    });

    // Helpful browser-level camera errors.
    window.addEventListener("unhandledrejection", (event) => {
      console.error("Unhandled promise rejection:", event.reason);
    });
  </script>
</body>
</html>
