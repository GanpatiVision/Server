<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ganpati AR - Stable</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#status{position:fixed;z-index:9999;top:14px;left:50%;transform:translateX(-50%);
padding:9px 14px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;
font:14px Arial;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="status">Starting camera...</div>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;
  uiLoading: no; uiScanning: no; uiError: no;
  filterMinCF: 0.0001; filterBeta: 0.001;
  warmupTolerance: 10; missTolerance: 30;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <a-asset-item id="ganpatiModel" src="./ganpati.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target">
    <a-light type="ambient" intensity="2"></a-light>
    <a-light type="directional" intensity="2" position="1 2 1"></a-light>
    <a-gltf-model id="ganpati" src="#ganpatiModel"
      position="0 0 0.15" rotation="0 0 0" scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>
</a-scene>

<script>
const scene=document.querySelector('a-scene');
const status=document.querySelector('#status');
const target=document.querySelector('#target');

scene.addEventListener('arReady',()=>{
  status.textContent='Camera ready - point at your pattern.';
});
target.addEventListener('targetFound',()=>{
  status.textContent='Ganpati locked to the pattern.';
});
target.addEventListener('targetLost',()=>{
  status.textContent='Keep the pattern visible to keep Ganpati anchored.';
});
</script>
</body>
</html>
